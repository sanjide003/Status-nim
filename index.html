<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>അഡ്മിഷൻ പോസ്റ്റർ മേക്കർ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <!-- Google Fonts: Noto Sans Malayalam, Noto Kufi Arabic, Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700&family=Noto+Sans+Malayalam:wght@700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans Malayalam', 'Poppins', sans-serif; 
            background-color: #f0f2f5; 
        }
        .canvas-container { 
            width: 100%;
            max-width: 500px; 
            margin: 0 auto;
            overflow: hidden; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        }
        canvas { width: 100%; height: auto; display: block; }
        .cropper-container { max-height: 50vh; }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Section 1: Form Controls -->
        <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col border-b md:border-b-0 md:border-r border-gray-200 order-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-red-800 mb-2">പോസ്റ്റർ തയ്യാറാക്കാം</h2>
                <p class="text-gray-600 text-sm">താഴെ പേര് നൽകി ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുക.</p>
            </div>

            <!-- Input Section -->
            <div id="input-section" class="flex-1 space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">വിദ്യാർത്ഥിയുടെ പേര് *</label>
                    <input type="text" id="studentName" placeholder="പേര് മലയാളത്തിലോ ഇംഗ്ലീഷിലോ നൽകുക" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">ഫോട്ടോ തിരഞ്ഞെടുക്കുക *</label>
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-red-50 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mb-2 text-gray-400">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                            </svg>
                            <p class="text-sm text-gray-600">ക്ലിക്ക് ചെയ്ത് ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുക</p>
                        </div>
                        <input type="file" id="imageInput" accept="image/png, image/jpeg" class="hidden" />
                    </label>
                </div>
            </div>

            <!-- Crop Section -->
            <div id="crop-section" class="hidden flex-1 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-gray-700">ഫോട്ടോ ക്രമീകരിക്കുക</h3>
                    <button id="cancelCropBtn" class="text-sm text-red-600 hover:text-red-800">റദ്ദാക്കുക</button>
                </div>
                <div class="cropper-container bg-black rounded-xl overflow-hidden">
                    <img id="imageToCrop" src="" alt="Crop preview" class="max-w-full">
                </div>
                <button id="generateBtn" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 px-4 rounded-xl transition shadow-md">
                    പോസ്റ്റർ തയ്യാറാക്കുക
                </button>
            </div>

            <!-- Action Buttons -->
            <div id="action-section" class="hidden mt-auto pt-6 space-y-3">
                <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex justify-center items-center gap-2 transition shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    ഡൗൺലോഡ് ചെയ്യുക
                </button>
                <button id="resetBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 px-4 rounded-xl transition">
                    പുതിയത് ചെയ്യുക
                </button>
            </div>
        </div>

        <!-- Section 2: Preview / Result -->
        <div class="w-full md:w-1/2 bg-gray-50 p-6 flex flex-col items-center justify-center order-2">
            <h3 class="text-sm uppercase tracking-wider text-gray-500 font-bold mb-4 text-center" id="previewTitle">പ്രിവ്യൂ</h3>
            
            <div id="defaultPreview" class="canvas-container bg-white border border-gray-200">
                <img src="template.png" alt="Template Preview" id="templateImg" class="w-full h-auto" onerror="this.src='https://via.placeholder.com/1080x1080.png?text=Template+Not+Found'">
            </div>

            <div id="resultPreview" class="canvas-container hidden bg-white border border-gray-200">
                <canvas id="posterCanvas" width="1080" height="1080"></canvas>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const imageInput = document.getElementById('imageInput');
        const studentNameInput = document.getElementById('studentName');
        const inputSection = document.getElementById('input-section');
        const cropSection = document.getElementById('crop-section');
        const actionSection = document.getElementById('action-section');
        const defaultPreview = document.getElementById('defaultPreview');
        const resultPreview = document.getElementById('resultPreview');
        const previewTitle = document.getElementById('previewTitle');
        const imageToCrop = document.getElementById('imageToCrop');
        const generateBtn = document.getElementById('generateBtn');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');

        let cropper;
        let templateImage = new Image();
        templateImage.src = 'template.png'; 

        // =========================================================================
        // ⚙️ കോൺഫിഗറേഷൻ (Coordinates & Settings)
        // =========================================================================
        
        // 1. ഫോട്ടോയുടെ സ്ഥാനം (കൂടുതൽ വലത്തോട്ട് നീക്കി)
        const PHOTO_X = 460;      // 430-ൽ നിന്നും 460 ആയി വർദ്ധിപ്പിച്ചു
        const PHOTO_Y = 170;      
        const PHOTO_WIDTH = 680;  
        const PHOTO_HEIGHT = 680; 

        // 2. പേരിന്റെ സ്ഥാനം 
        const TEXT_START_X = 60; // ഇടത് മാർജിൻ അല്പം കൂട്ടി
        const TEXT_Y = 830;      
        
        // 3. ഫോണ്ട് സെറ്റിംഗ്സ്
        const FONT_SIZE = 48;
        const FONT_FAMILY = "'Noto Kufi Arabic', 'Noto Sans Malayalam', 'Poppins', sans-serif";
        const TEXT_COLOR = "#8B0000"; // കടും ചുവപ്പ് (Dark Red) നിറം

        // 4. പേരിന് പിന്നിലെ ബോക്സ് സെറ്റിംഗ്സ് (അപ്‌ഡേറ്റ് ചെയ്തത്)
        const BOX_PADDING_X = 40; // ബോക്സിന്റെ വീതി അല്പം കൂട്ടി
        const BOX_HEIGHT = 100;    // ബോക്സിന്റെ ഉയരം അല്പം കൂട്ടി
        const BOX_COLOR = "#FDD835"; // ഡിസൈനിലെ മഞ്ഞ (Yellow/Gold) നിറം
        const BOX_RADIUS = 50;       // കൂടുതൽ റൗണ്ടഡ് കോർണറുകൾ (Pill shape)
        // =========================================================================


        imageInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = function (event) {
                    imageToCrop.src = event.target.result;
                    inputSection.classList.add('hidden');
                    cropSection.classList.remove('hidden');
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1, viewMode: 1, dragMode: 'move', background: false
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        cancelCropBtn.addEventListener('click', resetUI);

        generateBtn.addEventListener('click', function () {
            const name = studentNameInput.value.trim();
            
            if (!name || !cropper) {
                alert("ദയവായി വിദ്യാർത്ഥിയുടെ പേരും ഫോട്ടോയും നൽകുക.");
                return;
            }

            const croppedCanvas = cropper.getCroppedCanvas({
                width: PHOTO_WIDTH, height: PHOTO_HEIGHT
            });
            generateCanvasImage(croppedCanvas, name);
        });

        function generateCanvasImage(userImageCanvas, name) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ഫോട്ടോ വരയ്ക്കുന്നു
            ctx.drawImage(userImageCanvas, PHOTO_X, PHOTO_Y, PHOTO_WIDTH, PHOTO_HEIGHT);

            // ടെംപ്ലേറ്റ് വരയ്ക്കുന്നു
            ctx.drawImage(templateImage, 0, 0, canvas.width, canvas.height);

            // പേരും ബോക്സും വരയ്ക്കുന്നു
            if (name) {
                ctx.font = `bold ${FONT_SIZE}px ${FONT_FAMILY}`;
                ctx.textAlign = "left"; 
                ctx.textBaseline = "middle";

                const textMetrics = ctx.measureText(name);
                const textWidth = textMetrics.width;

                const boxX = TEXT_START_X - BOX_PADDING_X;
                const boxY = TEXT_Y - (BOX_HEIGHT / 2);
                const boxWidth = textWidth + (BOX_PADDING_X * 2);

                // റൗണ്ടഡ് ബോക്സ് വരയ്ക്കുന്നു (മഞ്ഞ നിറത്തിൽ)
                drawRoundedRect(ctx, boxX, boxY, boxWidth, BOX_HEIGHT, BOX_RADIUS, BOX_COLOR);

                // പേര് എഴുതുന്നു (കടും ചുവപ്പ് നിറത്തിൽ)
                ctx.fillStyle = TEXT_COLOR;
                ctx.fillText(name, TEXT_START_X, TEXT_Y);
            }

            cropSection.classList.add('hidden');
            actionSection.classList.remove('hidden');
            defaultPreview.classList.add('hidden');
            resultPreview.classList.remove('hidden');
            previewTitle.innerText = "തയ്യാറാക്കിയ പോസ്റ്റർ";
            resultPreview.scrollIntoView({ behavior: 'smooth' });
        }

        // Helper to draw rounded rectangle (കൂടുതൽ റൗണ്ടഡ് ആയി അപ്‌ഡേറ്റ് ചെയ്തു)
        function drawRoundedRect(ctx, x, y, width, height, radius, color) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            
            // ബോക്സിന് ചെറിയൊരു ഷാഡോ നൽകുന്നു (കൂടുതൽ 3D ലുക്ക് കിട്ടാൻ)
            ctx.shadowColor = "rgba(0, 0, 0, 0.2)";
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 4;
            
            ctx.fillStyle = color;
            ctx.fill();
            
            // ഷാഡോ റീസെറ്റ് ചെയ്യുന്നു (അല്ലെങ്കിൽ അക്ഷരങ്ങൾക്കും ഷാഡോ വരും)
            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        downloadBtn.addEventListener('click', function () {
            const link = document.createElement('a');
            link.download = 'Madrasa_Admission_Poster.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        resetBtn.addEventListener('click', resetUI);

        function resetUI() {
            actionSection.classList.add('hidden');
            cropSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            resultPreview.classList.add('hidden');
            defaultPreview.classList.remove('hidden');
            previewTitle.innerText = "പ്രിവ്യൂ";
            studentNameInput.value = '';
            imageInput.value = '';
            if(cropper) cropper.destroy();
            cropper = null;
        }
    </script>
</body>
</html>
