<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മദ്‌റസ അഡ്മിഷൻ പോസ്റ്റർ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.css for Image Cropping -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <!-- Google Fonts for Malayalam -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Malayalam', sans-serif; background-color: #f3f4f6; }
        #canvas-container { max-width: 100%; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        canvas { max-width: 100%; height: auto; }
        .cropper-container { max-height: 60vh; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-red-800 mb-6">അഡ്മിഷൻ പോസ്റ്റർ തയ്യാറാക്കുക</h2>

        <!-- Input Section -->
        <div id="input-section" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">വിദ്യാർത്ഥിയുടെ പേര്</label>
                <input type="text" id="studentName" placeholder="പേര് മലയാളത്തിൽ നൽകുക" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
                <input type="file" id="imageInput" accept="image/png, image/jpeg" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
            </div>
        </div>

        <!-- Crop Section (Hidden initially) -->
        <div id="crop-section" class="hidden mt-4 space-y-4">
            <h3 class="text-sm font-medium text-gray-700">ഫോട്ടോ ക്രോപ്പ് ചെയ്യുക:</h3>
            <div class="cropper-container bg-gray-100 rounded-lg overflow-hidden">
                <img id="imageToCrop" src="" alt="Crop preview" class="max-w-full">
            </div>
            <button id="cropBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                സേവ് ചെയ്യുക (Crop & Generate)
            </button>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="mt-6 hidden space-y-4">
            <h3 class="text-sm font-medium text-gray-700 text-center">നിങ്ങളുടെ പോസ്റ്റർ:</h3>
            <div id="canvas-container" class="border bg-gray-50">
                <!-- Canvas where the magic happens -->
                <canvas id="posterCanvas" width="1080" height="1080"></canvas>
            </div>
            <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex justify-center items-center gap-2 transition duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                ഡൗൺലോഡ് ചെയ്യുക
            </button>
            <button id="resetBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-200">
                പുതിയത് തയ്യാറാക്കുക
            </button>
        </div>
    </div>

    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        // Elements
        const imageInput = document.getElementById('imageInput');
        const studentNameInput = document.getElementById('studentName');
        const cropSection = document.getElementById('crop-section');
        const imageToCrop = document.getElementById('imageToCrop');
        const cropBtn = document.getElementById('cropBtn');
        const resultSection = document.getElementById('result-section');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const inputSection = document.getElementById('input-section');

        let cropper;
        let templateImage = new Image();
        
        // IMPORTANT: നിങ്ങൾ തയ്യാറാക്കിയ template.png ഇമേജിന്റെ URL ഇവിടെ നൽകണം. 
        // GitHub-ലേക്ക് push ചെയ്യുമ്പോൾ index.html ഉള്ള അതേ ഫോൾഡറിൽ template.png വെക്കുക.
        templateImage.src = 'template.png'; 

        // കോർഡിനേറ്റുകൾ (ഇവ നിങ്ങളുടെ ടെംപ്ലേറ്റിലെ വട്ടത്തിന് അനുസരിച്ച് മാറ്റേണ്ടി വരും)
        // ഇത് ഒരു അനുമാനമാണ്. ടെസ്റ്റ് ചെയ്ത ശേഷം ഈ നമ്പറുകൾ മാറ്റി കൊടുക്കുക.
        const PHOTO_X = 480;      // ഫോട്ടോ തുടങ്ങേണ്ട X കോർഡിനേറ്റ് (ഇടത് നിന്ന്)
        const PHOTO_Y = 120;      // ഫോട്ടോ തുടങ്ങേണ്ട Y കോർഡിനേറ്റ് (മുകളിൽ നിന്ന്)
        const PHOTO_WIDTH = 550;  // ഫോട്ടോയുടെ വീതി
        const PHOTO_HEIGHT = 550; // ഫോട്ടോയുടെ ഉയരം

        const TEXT_X = 540;       // പേര് വരേണ്ട X കോർഡിനേറ്റ് (മധ്യഭാഗം)
        const TEXT_Y = 950;       // പേര് വരേണ്ട Y കോർഡിനേറ്റ് (താഴെ)

        // Handle Image Upload
        imageInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                
                reader.onload = function (event) {
                    imageToCrop.src = event.target.result;
                    inputSection.classList.add('hidden');
                    cropSection.classList.remove('hidden');
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    // Initialize Cropper (1:1 Aspect ratio for circle)
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Crop and Generate Poster
        cropBtn.addEventListener('click', function () {
            if (!cropper) return;

            const name = studentNameInput.value.trim();
            const croppedCanvas = cropper.getCroppedCanvas({
                width: PHOTO_WIDTH,
                height: PHOTO_HEIGHT
            });

            generatePoster(croppedCanvas, name);
        });

        function generatePoster(userImageCanvas, name) {
            // Clear previous drawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw User Photo FIRST (So it stays behind the template)
            ctx.drawImage(userImageCanvas, PHOTO_X, PHOTO_Y, PHOTO_WIDTH, PHOTO_HEIGHT);

            // 2. Draw Template Image OVER the photo
            ctx.drawImage(templateImage, 0, 0, canvas.width, canvas.height);

            // 3. Draw Student Name
            if (name) {
                ctx.font = "bold 45px 'Noto Sans Malayalam', sans-serif";
                ctx.fillStyle = "#ffffff"; // നിറം മാറ്റാം (ഉദാഹരണത്തിന് #000000 കറുപ്പിന്)
                ctx.textAlign = "center";
                
                // പേരിന് ചുറ്റും ചെറിയൊരു ഷാഡോ നൽകാൻ (വ്യക്തതയ്ക്ക്)
                ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                ctx.fillText(name, TEXT_X, TEXT_Y);
                
                // Reset shadow
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            }

            // Show Result
            cropSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
        }

        // Handle Download
        downloadBtn.addEventListener('click', function () {
            const link = document.createElement('a');
            link.download = 'madrasa_admission_poster.jpg';
            // Convert to JPEG for smaller file size
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });

        // Handle Reset
        resetBtn.addEventListener('click', function() {
            resultSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            imageInput.value = '';
            if(cropper) { cropper.destroy(); }
        });

        // Ensure template is loaded
        templateImage.onload = function() {
            console.log("Template loaded successfully");
        }
        templateImage.onerror = function() {
            alert("Error: template.png കാണാൻ സാധിക്കുന്നില്ല. ദയവായി ഇമേജ് ഫോൾഡറിൽ ഉണ്ടെന്ന് ഉറപ്പുവരുത്തുക.");
        }
    </script>
</body>
</html>
