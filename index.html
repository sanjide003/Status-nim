<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Poster Generator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.css for Image Cropping -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <!-- Google Fonts: Poppins (English), Noto Sans Malayalam, Noto Kufi Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700&family=Noto+Sans+Malayalam:wght@700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f8fafc; 
        }
        .canvas-container { 
            max-width: 100%; 
            overflow: hidden; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
        }
        canvas { max-width: 100%; height: auto; display: block; }
        .cropper-container { max-height: 50vh; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Column: Preview / Result -->
        <div class="w-full md:w-1/2 bg-gray-50 p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-gray-200">
            <h3 class="text-sm uppercase tracking-wider text-gray-500 font-semibold mb-4 text-center" id="previewTitle">Poster Preview</h3>
            
            <!-- Default Template Preview -->
            <div id="defaultPreview" class="canvas-container bg-white border border-gray-200">
                <img src="template.png" alt="Template Preview" id="templateImg" class="w-full h-auto object-cover" onerror="this.src='https://via.placeholder.com/1080x1080.png?text=Template.png+Missing'">
            </div>

            <!-- Canvas Result (Hidden initially) -->
            <div id="resultPreview" class="canvas-container hidden bg-white border border-gray-200">
                <canvas id="posterCanvas" width="1080" height="1080"></canvas>
            </div>
        </div>

        <!-- Right Column: Form Controls -->
        <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col">
            <div class="mb-8">
                <h2 class="text-2xl md:text-3xl font-bold text-red-800 mb-2">Create Your Poster</h2>
                <p class="text-gray-500 text-sm">Upload your photo and enter your name to generate the admission poster.</p>
            </div>

            <!-- Input Section -->
            <div id="input-section" class="flex-1 space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter name (English, Malayalam, or Arabic)" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-all outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Photo</label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-all">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-3 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                </svg>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                <p class="text-xs text-gray-500">PNG or JPG</p>
                            </div>
                            <input type="file" id="imageInput" accept="image/png, image/jpeg" class="hidden" />
                        </label>
                    </div>
                </div>
            </div>

            <!-- Crop Section (Hidden initially) -->
            <div id="crop-section" class="hidden flex-1 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-semibold text-gray-700">Adjust Your Photo</h3>
                    <button id="cancelCropBtn" class="text-xs text-red-600 font-semibold hover:text-red-800">Cancel</button>
                </div>
                <div class="cropper-container bg-black rounded-xl overflow-hidden">
                    <img id="imageToCrop" src="" alt="Crop preview" class="max-w-full">
                </div>
                <button id="generateBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2">
                    Generate Poster
                </button>
            </div>

            <!-- Action Buttons (Visible after generation) -->
            <div id="action-section" class="hidden mt-auto pt-6 space-y-3">
                <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex justify-center items-center gap-2 transition duration-200 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Download Poster
                </button>
                <button id="resetBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-xl transition duration-200">
                    Create Another
                </button>
            </div>

        </div>
    </div>

    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        // DOM Elements
        const imageInput = document.getElementById('imageInput');
        const studentNameInput = document.getElementById('studentName');
        const inputSection = document.getElementById('input-section');
        const cropSection = document.getElementById('crop-section');
        const actionSection = document.getElementById('action-section');
        const defaultPreview = document.getElementById('defaultPreview');
        const resultPreview = document.getElementById('resultPreview');
        const previewTitle = document.getElementById('previewTitle');
        const imageToCrop = document.getElementById('imageToCrop');
        const generateBtn = document.getElementById('generateBtn');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');

        let cropper;
        let templateImage = new Image();
        
        // IMPORTANT: The transparent PNG template file name
        templateImage.src = 'template.png'; 

        // =========================================================================
        // ⚠️ ഫോട്ടോയുടെയും പേരിന്റെയും സ്ഥാനം ക്രമീകരിക്കാനുള്ള കോർഡിനേറ്റുകൾ
        // (വരി നമ്പർ: 173 മുതൽ 182 വരെ)
        // =========================================================================
        
        // 1. ഫോട്ടോയുടെ സ്ഥാനം (Photo Position)
        const PHOTO_X = 380;      // ഫോട്ടോ ഇടത്തുനിന്നും വലത്തോട്ട് നീക്കാൻ നമ്പർ കൂട്ടുക
        const PHOTO_Y = 160;      // ഫോട്ടോ മുകളിൽ നിന്നും താഴോട്ട് ഇറക്കാൻ നമ്പർ കൂട്ടുക
        const PHOTO_WIDTH = 680;  // ഫോട്ടോയുടെ വീതി (വൃത്തത്തിന്റെ വലുപ്പം)
        const PHOTO_HEIGHT = 680; // ഫോട്ടോയുടെ ഉയരം (വൃത്തത്തിന്റെ വലുപ്പം)

        // 2. പേര് വരുന്ന സ്ഥാനം (Text Position)
        const TEXT_X = 265;       // പേര് ഇടത്തുനിന്നും വലത്തോട്ട് നീക്കാൻ നമ്പർ കൂട്ടുക
        const TEXT_Y = 820;       // പേര് മുകളിൽ നിന്നും താഴോട്ട് ഇറക്കാൻ നമ്പർ കൂട്ടുക
        // =========================================================================

        // Handle Image Upload
        imageInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                
                reader.onload = function (event) {
                    imageToCrop.src = event.target.result;
                    
                    inputSection.classList.add('hidden');
                    cropSection.classList.remove('hidden');
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1, // കൃത്യമായ വട്ടം കിട്ടാൻ 1:1 അനുപാതം
                        viewMode: 1,
                        dragMode: 'move',
                        background: false
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Cancel Crop
        cancelCropBtn.addEventListener('click', function() {
            cropSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            imageInput.value = '';
            if(cropper) cropper.destroy();
        });

        // Helper function to detect Arabic characters
        function containsArabic(text) {
            const arabicRegex = /[\u0600-\u06FF]/;
            return arabicRegex.test(text);
        }

        // Generate Poster
        generateBtn.addEventListener('click', function () {
            if (!cropper) return;

            const name = studentNameInput.value.trim();
            const croppedCanvas = cropper.getCroppedCanvas({
                width: PHOTO_WIDTH,
                height: PHOTO_HEIGHT
            });

            generateCanvasImage(croppedCanvas, name);
        });

        function generateCanvasImage(userImageCanvas, name) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ഫോട്ടോ ആദ്യം വരയ്ക്കുന്നു (ടെംപ്ലേറ്റിന് പിന്നിലായി വരാൻ)
            ctx.drawImage(userImageCanvas, PHOTO_X, PHOTO_Y, PHOTO_WIDTH, PHOTO_HEIGHT);

            // ട്രാൻസ്പരൻ്റ് ആയ ടെംപ്ലേറ്റ് മുകളിൽ വരയ്ക്കുന്നു
            ctx.drawImage(templateImage, 0, 0, canvas.width, canvas.height);

            // പേര് എഴുതുന്നു
            if (name) {
                const isArabic = containsArabic(name);
                
                // ഇംഗ്ലീഷ്, മലയാളം, അറബി ഫോണ്ടുകൾ
                ctx.font = "bold 46px 'Noto Kufi Arabic', 'Noto Sans Malayalam', 'Poppins', sans-serif";
                
                // പേരിന്റെ നിറം (ഇപ്പോൾ നൽകിയിരിക്കുന്നത് ഡിസൈനിലെ ചുവപ്പ് നിറമാണ്)
                ctx.fillStyle = "#a81628"; 
                ctx.textAlign = "center";
                
                if (isArabic) {
                    ctx.direction = "rtl";
                } else {
                    ctx.direction = "ltr";
                }

                ctx.shadowColor = "rgba(255, 255, 255, 0.9)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                ctx.fillText(name, TEXT_X, TEXT_Y);
                
                ctx.shadowBlur = 0;
                ctx.direction = "ltr";
            }

            cropSection.classList.add('hidden');
            actionSection.classList.remove('hidden');
            
            defaultPreview.classList.add('hidden');
            resultPreview.classList.remove('hidden');
            previewTitle.innerText = "Your Generated Poster";
        }

        // Download Action
        downloadBtn.addEventListener('click', function () {
            const link = document.createElement('a');
            link.download = 'Admission_Poster_2026.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        // Reset Action
        resetBtn.addEventListener('click', function() {
            actionSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            
            resultPreview.classList.add('hidden');
            defaultPreview.classList.remove('hidden');
            previewTitle.innerText = "Poster Preview";
            
            studentNameInput.value = '';
            imageInput.value = '';
            if(cropper) cropper.destroy();
        });
    </script>
</body>
</html>
